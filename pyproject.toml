[project]
name = "blackjack-counter-vision"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "opencv-python==5.0.0.93",
  "pillow==13.0.0",
  "mss==10.2.0",
  "screeninfo==0.8.1",
  "requests==2.34.2",
  "onnxruntime==1.31.0",
  "psutil==7.2.2",
  "pyyaml==6.0.3",
  "winocr==0.0.15; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "dulwich==1.2.19",
    "onnx>=1.23.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
